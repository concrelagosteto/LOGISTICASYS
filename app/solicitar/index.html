<style>
  :root{
    --bg:#070a10; --surface:#0f141c; --surface-2:#151b24; --surface-3:#1b222c;
    --border:#232c38; --border-strong:#374353;
    --text:#e8ecf2; --text-muted:#98a5b6; --text-faint:#7a8696;
    --accent:#ff3d6e; --accent-strong:#ff7a99; --accent-soft:#2a0f1a; --accent-btn:#e11d48;
    --success:#38c793; --success-soft:#0f2620;
    --warning:#e7ac55; --warning-soft:#2c2211;
    --danger:#ff8a5c; --danger-soft:#2d1810;
    --info:#b794f6; --info-soft:#201733;
    --neutral:#9aa6b6; --neutral-soft:#1a212b;
    --shadow:0 4px 14px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.35);
    --radius:10px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.5; letter-spacing:.1px;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  [hidden]{display:none !important;}

  /* ---------- Entrada por chave ---------- */
  #login{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:#060a12 url("../login-bg.webp") center center / cover no-repeat;}
  .login-card{width:100%; max-width:380px; background:rgba(12,17,25,.82); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); border:1px solid rgba(255,255,255,.07); border-radius:var(--radius);
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,61,110,.05); padding:28px 24px;}
  .login-brand{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px;}
  .mark{width:44px; height:44px; border-radius:10px; background:linear-gradient(155deg,#ff3d6e,#c0153f); box-shadow:0 4px 16px rgba(255,61,110,.35); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; margin-bottom:10px;}
  .login-brand h1{font-size:17px; font-weight:700;}
  .login-brand p{margin:2px 0 0; font-size:13px; color:var(--text-muted);}
  .field label{display:block; font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field-input{display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); border-radius:6px; padding:9px 11px; background:var(--surface);}
  .field-input:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,61,110,.16);}
  .field-input input{border:none; outline:none; background:transparent; font-size:14px; width:100%; color:var(--text); font-family:inherit; letter-spacing:.06em;}
  .eye{flex:none; background:none; border:none; padding:2px 4px; margin:0 -4px 0 0; color:var(--text-muted); display:flex; align-items:center; border-radius:6px;}
  .eye:hover{color:var(--accent-strong);} .eye:focus-visible{outline:2px solid var(--accent);}
  .btn{border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text); border-radius:6px; padding:8px 14px; font-size:12.5px; font-weight:600; transition:border-color .12s, background .12s, color .12s;}
  .btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{width:100%; background:var(--accent-btn); color:#fff; border:none; border-radius:6px; padding:10px; font-size:13px; font-weight:600; margin-top:14px; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .btn-primary:hover:not(:disabled){filter:brightness(1.12); background:var(--accent-btn); color:#fff;}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary.inline{width:auto; padding:10px 22px; margin-top:0;}
  .btn.ok{border-color:var(--success); color:var(--success); background:var(--success-soft);}
  .btn.ruim{color:var(--danger);}
  .login-note{margin:12px 0 0; text-align:center; font-size:12px; color:var(--text-faint); min-height:1.4em;}
  .login-note.bad{color:var(--danger);}

  /* ---------- Estrutura ---------- */
  .top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top, 0px)); background:var(--surface); border-bottom:1px solid var(--border); box-shadow:0 1px 0 var(--border), 0 4px 14px rgba(0,0,0,.10);}
  .top .mark{width:34px; height:34px; font-size:13px; margin:0; flex:none;}
  .top-t{flex:1; min-width:0;}
  .top-t strong{display:block; font-size:14px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .top-t span{display:block; font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .relogio{flex:none; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .relogio.aberto{color:var(--success); background:var(--success-soft);}
  .relogio.fechado{color:var(--danger); background:var(--danger-soft);}
  main{max-width:960px; margin:0 auto; padding:18px 16px calc(40px + env(safe-area-inset-bottom, 0px));}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px;}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:15px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .card-head h2{font-size:14px; font-weight:700; letter-spacing:.01em;}
  .card-head p{margin:3px 0 0; font-size:12px; color:var(--text-muted);}
  .pad{padding:16px 18px;}
  .muted{color:var(--text-muted);} .faint{color:var(--text-faint);}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; letter-spacing:.01em;}
  .badge.success{background:var(--success-soft); color:var(--success);}
  .badge.warning{background:var(--warning-soft); color:var(--warning);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}
  .badge.info{background:var(--info-soft); color:var(--info);}
  .badge.neutral{background:var(--neutral-soft); color:var(--neutral);}

  .aviso{padding:12px 16px; border-radius:8px; font-size:13px; font-weight:600; margin-bottom:14px; border:1px solid transparent; line-height:1.5;}
  .aviso.ok{background:var(--success-soft); color:var(--success); border-color:rgba(56,199,147,.3);}
  .aviso.bad{background:var(--danger-soft); color:var(--danger); border-color:rgba(255,138,92,.3);}
  .aviso.warn{background:var(--warning-soft); color:var(--warning); border-color:rgba(231,172,85,.3);}
  .aviso.info{background:var(--info-soft); color:var(--info); border-color:rgba(183,148,246,.3);}
  .aviso .acoes{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;}
  .aviso input[type=text]{flex:1; min-width:180px; background:var(--surface); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:8px 10px; font-size:13px; font-family:inherit;}

  /* ---------- Editor de linhas ---------- */
  .linhas-cab, .linha{display:grid; grid-template-columns:minmax(200px,1.8fr) minmax(90px,.6fr) minmax(150px,1fr) minmax(110px,.7fr) 40px; gap:10px; align-items:center;}
  .linhas-cab{padding:0 0 6px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint);}
  .linha{margin-bottom:10px;}
  .linha select, .linha input{width:100%; height:40px; background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:0 10px; font-size:14px; font-family:inherit;}
  .linha select:focus, .linha input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,61,110,.16);}
  .linha input[type=date]{color-scheme:dark;}
  .linha .rm{height:40px; width:40px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-muted); border-radius:6px; font-size:16px; line-height:1;}
  .linha .rm:hover:not(:disabled){border-color:var(--danger); color:var(--danger); background:var(--danger-soft);}
  .linha.erro select, .linha.erro input{border-color:var(--danger);}
  .linhas-box.off{opacity:.4; pointer-events:none;}
  .acoes-editor{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:6px;}
  .acoes-editor .grow{flex:1;}
  .sem-btn[aria-pressed=true]{border-color:var(--info); color:var(--info); background:var(--info-soft);}
  .msg-erro{margin:6px 0 0; font-size:12.5px; color:var(--danger); min-height:1.2em;}
  .status-env{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;}

  /* ---------- Histórico e lista ---------- */
  details.hist summary{cursor:pointer; padding:14px 18px; font-size:13px; font-weight:700; list-style:none; display:flex; align-items:center; gap:8px;}
  details.hist summary::-webkit-details-marker{display:none;}
  details.hist summary::before{content:"▸"; color:var(--text-faint); transition:transform .12s;}
  details.hist[open] summary::before{transform:rotate(90deg);}
  .v{padding:12px 18px; border-top:1px solid var(--border);}
  .manter{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin:2px 0 12px; cursor:pointer;}
  .manter input{width:18px; height:18px; accent-color:var(--accent);}
  .btn.instalar{width:100%; margin-top:14px; min-height:44px;}
  .v-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:4px; font-size:12.5px;}
  .v-linhas{font-size:12.5px; color:var(--text-muted);}
  .hz-dia{border-top:1px solid var(--border);}
  .hz-lista{list-style:none; margin:0; padding:2px 18px 12px 18px;}
  .hz-ev{display:grid; grid-template-columns:92px 22px 1fr; gap:6px; align-items:start; padding:6px 0 6px 10px; border-left:2px solid var(--border); font-size:12.5px; line-height:1.45;}
  .hz-hora{color:var(--text-faint); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .hz-ic{text-align:center;}
  .hz-por{color:var(--text-faint);}
  .hz-txt s{opacity:.7;}
  .hz-env{border-left-color:var(--info, #60a5fa);} .hz-mud, .hz-ped{border-left-color:var(--warning);} .hz-ok{border-left-color:var(--success);} .hz-ok .hz-txt b{color:var(--success);}
  .hz-neg, .hz-canc{border-left-color:var(--danger);} .hz-neg .hz-txt b, .hz-canc .hz-txt b{color:var(--danger);}
  .v-apagada .v-linhas{text-decoration:line-through; opacity:.75;}
  .tabela{width:100%; border-collapse:collapse;}
  .tabela th{padding:9px 14px; text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); border-bottom:1px solid var(--border); white-space:nowrap;}
  .tabela td{padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  .tabela tr:last-child td{border-bottom:none;}
  .scroll-x{overflow-x:auto;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); gap:10px; margin-bottom:16px;}
  .stat{text-align:left; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--st, var(--border-strong)); border-radius:8px; padding:10px 14px; color:var(--text);}
  .stat b{display:block; font-size:22px; line-height:1.15; font-variant-numeric:tabular-nums;}
  .stat span{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
  button.stat:hover, .stat.sel{border-color:var(--accent); background:var(--accent-soft);}
  .aut-item{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border);}
  .aut-item:first-of-type{border-top:none;}
  .aut-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .aut-btns .btn-primary{margin-top:0;}
  .aut-item .info{min-width:0; flex:1 1 220px;}
  .aut-item .info b{display:block; font-size:13.5px;}
  .aut-item .info span{font-size:12px; color:var(--text-muted);}
  .voltar{margin-bottom:14px;}
  .pick{display:flex; flex-wrap:wrap; gap:10px; padding:14px 18px; align-items:center;}
  .pick select{flex:1 1 260px; min-width:0; height:40px; background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:0 10px; font-size:14px; font-family:inherit;}
  .pick .btn-primary{flex:0 0 auto;}
  .centro{padding:30px 18px; text-align:center; color:var(--text-muted);}

  /* ---------- Pedido programado (travado) e Meus pedidos ---------- */
  .linha.travada{display:block; padding:11px 14px; border:1px solid rgba(56,199,147,.35); background:var(--success-soft); border-radius:8px; font-size:13px; line-height:1.5;}
  .linha.travada b{color:var(--text);}
  .mp-dia{border-top:1px solid var(--border);}
  .mp-dia:first-child{border-top:none;}
  .mp-dia-cab{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 18px 6px; font-size:13px; font-weight:700;}
  .mp-linha{padding:8px 18px 12px; display:flex; flex-direction:column; gap:6px;}
  .confirma-envio{margin-top:12px;} .confirma-envio ul{margin:4px 0 0; padding-left:18px;} .confirma-envio li{margin:2px 0;}
  .ce-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:10px 0;} .ce-tit{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.8;}
  .mp-cancelado b{text-decoration:line-through; color:var(--text-muted, #64748b);}
  .mp-topo{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13.5px;}
  .mp-cargas{display:flex; flex-direction:column; gap:4px; padding-left:4px;}
  .mp-carga{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12.5px; color:var(--text-muted);}
  .mp-carga .placa{font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; color:var(--text); letter-spacing:.03em;}
  .mp-acoes{display:flex; flex-wrap:wrap; gap:8px;}
  .mp-acoes .btn{padding:6px 12px; font-size:12.5px;}
  .mp-form{border:1px solid var(--border-strong); border-radius:8px; padding:12px 14px; background:var(--surface-2); display:flex; flex-direction:column; gap:10px;}
  .mp-form .campos{display:flex; flex-wrap:wrap; gap:10px;}
  .mp-form label{display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); flex:1 1 140px;}
  .mp-form select, .mp-form input, .mp-form textarea{width:100%; background:var(--surface); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:8px 10px; font-size:14px; font-family:inherit; text-transform:none; letter-spacing:0; font-weight:400;}
  .mp-form textarea{min-height:64px; resize:vertical;}
  .mp-alt{padding:10px 18px; border-top:1px solid var(--border); font-size:12.5px; display:flex; flex-direction:column; gap:3px;}

  #carregando{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(7,10,16,.7); color:var(--text-muted); font-size:13px;}

  @media (max-width:600px){
    .linhas-cab{display:none;}
    .linha{grid-template-columns:1fr 1fr; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--surface);}
    .linha .m{grid-column:1 / -1; order:1;}
    .linha .c{grid-column:1; order:2;}
    .linha .rm{grid-column:2; justify-self:end; width:100%; order:3;}
    .linha .d{grid-column:1; order:4;} .linha .p{grid-column:2; order:5;}
    .tabela .oculta-mobile{display:none;}
    .top{flex-wrap:wrap; gap:8px 10px;}
    .relogio{order:9; flex:1 1 100%; text-align:center; white-space:normal;}
    .tabela th, .tabela td{padding-left:10px; padding-right:10px;}
    .btn-primary.inline{width:100%;}
    .acoes-editor .grow{display:none;}
    .acoes-editor .btn, .acoes-editor .btn-primary{flex:1 1 100%;}
  }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">CL</div>
      <h1>CONCRELAGOS</h1>
      <p>Solicitação de Cimento</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="chave">Chave de acesso</label>
        <div class="field-input">
          <span aria-hidden="true">🔑</span>
          <input type="password" id="chave" name="chave" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required>
          <button type="button" class="eye" id="olho" aria-label="Mostrar chave" aria-pressed="false" title="Mostrar/ocultar a chave"><svg id="olhoIc" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <label class="manter"><input type="checkbox" id="manter"> Manter conectado neste aparelho</label>
      <button class="btn-primary" type="submit" id="entrar">Entrar</button>
      <p class="login-note" id="loginMsg" role="alert"></p>
      <p class="login-note" style="margin-top:4px">A chave foi entregue pela Logística. Cada usina tem a sua.</p>
      <button type="button" class="btn instalar" id="btnInstalar" hidden>📲 Instalar no celular (ícone na tela inicial)</button>
      <p class="login-note instalar-ios" id="dicaIos" hidden>📲 Para ter o ícone no iPhone: toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>.</p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="mark">CL</div>
    <div class="top-t"><strong id="quem"></strong><span id="quemSub"></span></div>
    <span class="relogio" id="relogio" title=""></span>
    <button class="btn" id="atualizar" title="Buscar dados novos">↻</button>
    <button class="btn" id="sair">Sair</button>
  </header>
  <main id="conteudo"></main>
</div>
<div id="carregando">Carregando…</div>

<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script>
(function(){
  "use strict";
  var CFG = window.CONFIG;
  var sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  var MATERIAIS = ["CP2", "CP3", "CP5", "POZOLANA"];
  var CAT_NOME = { CP2: "CP II", CP3: "CP III", CP5: "CP V", POZOLANA: "Pozolana" };
  /* Materiais da usina: os cimentos dela no Controle de cimento (fábrica específica, ex. "Cimento Tupi — CP II E 40 RS").
     Usina sem cimento cadastrado: os tipos genéricos (CP II, CP III, CP V, Pozolana). Valor do select: "f:<fábrica>" ou "m:<tipo>". */
  function opcoesUsina(){ return (S.estado && Array.isArray(S.estado.opcoes)) ? S.estado.opcoes : []; }
  function rotuloMat(m, f){ return f ? f : (CAT_NOME[m] || m || ""); }
  function valMat(l){ return l.fabrica ? "f:" + l.fabrica : (l.material ? "m:" + l.material : ""); }
  function aplicarMat(l, v){
    v = String(v || "");
    if (v.indexOf("f:") === 0){ var f = v.slice(2), o = opcoesUsina().find(function(x){ return x.f === f; }); l.fabrica = f; if (o) l.material = o.m; }
    else if (v.indexOf("m:") === 0){ l.fabrica = ""; l.material = v.slice(2); }
    else { l.fabrica = ""; l.material = ""; }
  }
  function fmtCurta(iso){ var p = String(iso || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] : ""; }
  function opcoesMatHtml(atual, excluir){

        '</select><button type="button" class="btn-primary inline" data-act="abrir-sel" ' + (S.selUsina ? "" : "disabled") + '>Preencher pedido</button></div></div>';
    }
    h += '<div class="card"><div class="card-head"><div><h2>Suas usinas</h2><p>' + us.length + ' usina(s)' + (S.filtro !== "todas" ? ' · filtro ativo <button class="btn" style="padding:2px 8px;margin-left:6px" data-act="filtro" data-k="todas">limpar</button>' : "") + '</p></div></div>';
    if (!us.length) h += '<div class="centro">Nenhuma usina foi vinculada a você ainda. Fale com a Logística.</div>';
    else if (!lista.length) h += '<div class="centro">Nenhuma usina neste filtro.</div>';
    else {
      h += '<div class="scroll-x"><table class="tabela"><thead><tr><th>Usina</th><th>Situação</th><th class="oculta-mobile">Pedido</th><th></th></tr></thead><tbody>';
      lista.forEach(function(u){
        var sit = u.situacao === "pedido" ? '<span class="badge success">✔ Pedido</span>' : (u.situacao === "sem_necessidade" ? '<span class="badge info">Sem necessidade</span>' : '<span class="badge danger">Não respondeu</span>');
        var extra = (u.envio && u.envio.fora_do_prazo ? " " + seloFora(u.envio) : "") + (u.autorizacao && u.autorizacao.status === "pendente" ? ' <span class="badge warning">Aguardando autorização</span>' : "") + (u.versoes > 1 ? ' <span class="badge neutral">' + u.versoes + ' versões</span>' : "");
        h += '<tr><td><b>' + esc(u.usina) + '</b></td><td>' + sit + extra + '</td><td class="oculta-mobile muted">' + (u.envio && !u.envio.sem_necessidade ? resumoLinhas(u.envio.linhas) : "—") +
          (u.envio ? '<br><span class="faint" style="font-size:11.5px">' + esc(fmtHora(new Date(u.envio.enviado_em).getTime())) + (u.envio.por ? ' · ' + esc(u.envio.por) : "") + '</span>' : "") + '</td>' +
          '<td style="text-align:right"><button class="btn" data-act="abrir" data-u="' + esc(u.usina_id) + '">Abrir</button></td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';
    return h;
  }

  /* ---------- Ações ---------- */
  function validar(){
    var vistos = {}, hoje = hojeCivil();
    for (var i = 0; i < S.linhas.length; i++){
      var l = S.linhas[i], n = i + 1;
      if (l.travada) continue;   // já programada: o servidor confere
      if (MATERIAIS.indexOf(l.material) < 0) return { i: i, t: "Escolha o material na linha " + n + "." };
      var q = Number(l.carretas); if (!l.carretas || !isFinite(q) || q < 1 || q > 99 || Math.floor(q) !== q) return { i: i, t: "Informe a quantidade de carretas (1 a 99) na linha " + n + "." };
      if (!l.data) return { i: i, t: "Informe a data desejada na linha " + n + "." };
      if (l.data < hoje) return { i: i, t: "A data da linha " + n + " já passou." };
      var k = l.material + "|" + (l.fabrica || "") + "|" + l.data + "|" + (l.periodo || ""); if (vistos[k]) return { i: i, t: "Material, data e período repetidos na linha " + n + ". Some as carretas numa linha só." }; vistos[k] = 1;
    }
    return null;
  }
  function marcarErro(v){
    document.querySelectorAll(".linha").forEach(function(r){ r.classList.remove("erro"); });
    var e = $("erroEditor"); if (e) e.textContent = v ? v.t : "";
    if (v && v.i != null){ var r = document.querySelector('.linha[data-row="' + v.i + '"]'); if (r) r.classList.add("erro"); }
  }
  // O que já foi pedido para as mesmas datas de entrega (a solicitação de hoje e pedidos de dias anteriores),
  // para a usina conferir antes de mandar uma nova solicitação.
  function jaPedido(env){
    var datas = {}, out = [];
    if (!S.sem) S.linhas.forEach(function(l){ if (l.data) datas[String(l.data).slice(0, 10)] = 1; });
    if (env){
      if (env.sem_necessidade) out.push({ txt: "Hoje já foi respondido: <b>sem necessidade de cimento</b>", quando: env });
      else (env.linhas || []).forEach(function(l){ out.push({ data: String(l.data_desejada).slice(0, 10), txt: txtLinha(l.material, l.carretas, l.periodo, l.fabrica), quando: env }); });
    }
    ((S.mp && S.mp.pedidos) || []).forEach(function(p){
      if (env && p.id === env.id) return;
      (p.linhas || []).forEach(function(l){ var d = String(l.data_desejada).slice(0, 10); if (datas[d]) out.push({ data: d, txt: txtLinha(l.material, l.carretas, l.periodo, l.fabrica), dia: p.dia }); });
    });
    return out;
  }
  function htmlConfirmaEnvio(env){
    var ja = jaPedido(env), novas = S.sem ? '<li>Sem necessidade de cimento</li>' : S.linhas.map(function(l){ return '<li>' + (l.data ? "<b>" + esc(fmtData(l.data)) + "</b> — " : "") + txtLinha(l.material, l.carretas, l.periodo, l.fabrica) + (l.travada ? " 🔒" : "") + '</li>'; }).join("");
    var porData = {};
    ja.forEach(function(x){ var k = x.data || ""; (porData[k] = porData[k] || []).push(x); });
    var lista = Object.keys(porData).sort().map(function(k){
      return '<li>' + (k ? "<b>" + esc(fmtData(k)) + "</b> — " : "") + porData[k].map(function(x){
        return x.txt + ' <span class="faint">(' + (x.quando ? "solicitação de hoje, " + esc(fmtHora(new Date(x.quando.enviado_em).getTime())) + ", versão " + x.quando.versao : "pedido de " + esc(fmtData(String(x.dia).slice(0, 10)))) + ')</span>'; }).join("<br>") + '</li>'; }).join("");
    return '<div class="aviso warn confirma-envio" id="confirmaEnvio" role="alertdialog" aria-label="Confirmar nova solicitação"><b>⚠️ Já existe solicitação para ' + (Object.keys(porData).filter(Boolean).length > 1 ? "essas datas" : "esse dia") + '.</b> Confira se a nova solicitação confere antes de enviar' + (env ? " — ela <b>substitui</b> a solicitação de hoje" : "") + '.' +
      '<div class="ce-cols"><div><span class="ce-tit">Já solicitado</span><ul>' + lista + '</ul></div><div><span class="ce-tit">Nova solicitação</span><ul>' + novas + '</ul></div></div>' +
      '<div class="acoes"><button type="button" class="btn-primary inline" data-act="enviar-ok">✔ Confere, enviar nova solicitação</button><button type="button" class="btn" data-act="enviar-voltar">Voltar e corrigir</button></div></div>';
  }
  async function enviar(confirmado){
    if (S.enviando) return;
    if (!S.sem){ var v = validar(); if (v){ marcarErro(v); return; } }
    marcarErro(null);
    var est0 = S.estado || {}, env0 = est0.envio;
    if (!confirmado && (env0 || jaPedido(null).length)){ S.confirmaEnvio = true; desenhar(); var cx = $("confirmaEnvio"); if (cx) cx.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    S.confirmaEnvio = false;
    S.enviando = true; S.msg = ""; desenhar();
    try {
      var args = { p_chave: S.chave, p_sem_necessidade: S.sem, p_linhas: S.sem ? [] : S.linhas.map(function(l){ return { id: l.id || null, material: l.material, fabrica: l.fabrica || null, carretas: Number(l.carretas), data_desejada: l.data, periodo: l.periodo || "" }; }) };
      if (S.tipo === "encarregado") args.p_usina = S.usinaSel;
      var d = await chamar("solic_k_enviar", args);
      if (d.erro){ S.enviando = false; sair(); msgLogin(ERROS[d.erro] || "Sessão encerrada.", true); return; }
      S.enviando = false; S.sujo = false;
      var env = d.estado && d.estado.envio;
      S.msg = S.sem ? "Resposta registrada: sem necessidade de cimento." : "Solicitação enviada" + (env ? " (versão " + env.versao + ")" : "") + ".";
      if (!S.sem && env && env.fora_do_prazo){ S.msg += " Atenção: pedido feito depois das 16h — não há certeza da entrega deste pedido."; }
      S.msgTipo = "ok"; aplicar(d, true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      S.enviando = false; S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); window.scrollTo({ top: 0, behavior: "smooth" });
      recarregar(false);
    }
  }
  async function pedirAutorizacao(){
    try {
      var d = await chamar("solic_k_pedir_autorizacao", { p_chave: S.chave, p_motivo: ($("motivo") && $("motivo").value) || "" });
      if (d.erro){ sair(); msgLogin(ERROS[d.erro], true); return; }
      S.motivo = ""; S.msg = "Pedido enviado ao encarregado. Esta tela atualiza sozinha quando ele responder."; S.msgTipo = "ok"; aplicar(d, false);
    } catch (e) { S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); }
  }
  async function decidir(id, aprovar, abrir){
    try {
      var d = await chamar("solic_k_decidir", { p_chave: S.chave, p_id: id, p_aprovar: aprovar, p_usina: S.usinaSel });
      if (d.erro){ sair(); msgLogin(ERROS[d.erro], true); return; }
      S.confirmaNegar = null; S.msg = aprovar ? (abrir ? "Autorizado. Preencha o pedido desta usina abaixo." : "Liberado por 60 minutos.") : "Pedido negado."; S.msgTipo = "ok";
      if (abrir){ var msg = S.msg; await abrirUsina(abrir); S.msg = msg; S.msgTipo = "ok"; desenhar(); }
      else await recarregar(false);
    } catch (e) { S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); }
  }
  async function abrirUsina(id){
    S.usinaSel = id; S.msg = ""; S.sujo = false; S.mp = null; S.mpForm = null; carregando(true);
    try { var d = await chamar("solic_k_estado", { p_chave: S.chave, p_usina: id }); aplicar(d, true); window.scrollTo(0, 0); }
    catch (e) { S.usinaSel = null; S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); }
    carregando(false);
  }

  $("conteudo").addEventListener("input", function(ev){
    var t = ev.target; if (t.id === "motivo"){ S.motivo = t.value; return; }
    if (S.mpForm && /^mp(Mat|Car|Per|Mot)$/.test(t.id)){ S.mpForm[{ mpMat: "material", mpCar: "carretas", mpPer: "periodo", mpMot: "motivo" }[t.id]] = t.value; S.mpForm.erro = ""; return; }
    if (t.dataset.i === undefined) return;
    if (t.dataset.f === "material") aplicarMat(S.linhas[+t.dataset.i], t.value); else S.linhas[+t.dataset.i][t.dataset.f] = t.value;
    S.sujo = true; marcarErro(null);
  });
  $("conteudo").addEventListener("change", function(ev){
    var t = ev.target;
    if (S.mpForm && /^mp(Mat|Car|Per|Mot)$/.test(t.id)){ S.mpForm[{ mpMat: "material", mpCar: "carretas", mpPer: "periodo", mpMot: "motivo" }[t.id]] = t.value; return; }
    if (t.id === "selUsina"){ S.selUsina = t.value; var bt = document.querySelector('[data-act="abrir-sel"]'); if (bt) bt.disabled = !t.value; return; }
    if (t.dataset.i === undefined) return;
    if (t.dataset.f === "material") aplicarMat(S.linhas[+t.dataset.i], t.value); else S.linhas[+t.dataset.i][t.dataset.f] = t.value;
    S.sujo = true;
    if (S.confirmaEnvio){ S.confirmaEnvio = false; desenhar(); }   // mudou o pedido: confere de novo ao enviar
  });
  $("conteudo").addEventListener("toggle", function(ev){ if (ev.target.classList && ev.target.classList.contains("hist")) S.abertoHist = ev.target.open; }, true);
  $("conteudo").addEventListener("click", function(ev){
    var b = ev.target.closest && ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    var a = b.dataset.act;
    if ((a === "add" || a === "rm" || a === "sem") && S.confirmaEnvio) S.confirmaEnvio = false;
    if (a === "add"){ if (S.linhas.length < 30){ S.linhas.push(novaLinha()); S.sujo = true; desenhar(); var ss = document.querySelectorAll('select[data-f="material"]'); if (ss.length) ss[ss.length - 1].focus(); } }
    else if (a === "rm"){ if (S.linhas.length > 1){ S.linhas.splice(+b.dataset.i, 1); S.sujo = true; desenhar(); } }
    else if (a === "sem"){ S.sem = !S.sem; S.sujo = true; desenhar(); }
    else if (a === "enviar") enviar(false);
    else if (a === "enviar-ok") enviar(true);
    else if (a === "enviar-voltar"){ S.confirmaEnvio = false; desenhar(); }
    else if (a === "pedir") pedirAutorizacao();
    else if (a === "filtro"){ S.filtro = S.filtro === b.dataset.k ? "todas" : b.dataset.k; desenhar(); }
    else if (a === "abrir") abrirUsina(b.dataset.u);
    else if (a === "abrir-sel"){ if (S.selUsina) abrirUsina(S.selUsina); }
    else if (a === "voltar"){ S.usinaSel = null; S.msg = ""; S.sujo = false; S.mp = null; S.mpForm = null; recarregar(true); }
    else if (a === "aprovar") decidir(b.dataset.id, true);
    else if (a === "aprovar-abrir") decidir(b.dataset.id, true, b.dataset.u);
    else if (a === "negar"){ if (S.confirmaNegar !== b.dataset.id){ S.confirmaNegar = b.dataset.id; desenhar(); } else decidir(b.dataset.id, false); }
    else if (a === "mp-abrir"){
      var l = mpLinha(b.dataset.l); if (!l) return;
      S.mpForm = { linha: l.id, tipo: b.dataset.t, material: "", carretas: String(l.carretas), periodo: l.periodo || "", motivo: "", erro: "" };
      desenhar(); var mt = $("mpMot"); if (mt && b.dataset.t === "cancelar") mt.focus();
    }
    else if (a === "mp-fechar"){ S.mpForm = null; desenhar(); }
    else if (a === "mp-enviar") mpEnviar();
  });

  /* ---------- Início ---------- */
  (async function iniciar(){
    var c = lembrada(); if (!c) { $("chave").focus(); return; }
    carregando(true);
    try { await entrar(c); } catch (e) { guardar(""); }
    carregando(false);
  })();
  (function(){   // aviso de versão nova (navegador com a página antiga guardada)
    var meta = document.querySelector('meta[name="app-versao"]'), minha = meta ? meta.content : ""; if (!minha || !window.fetch) return;
    var avisado = false;
    function conferir(){
      if (avisado || document.visibilityState !== "visible") return;
      fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.ok ? r.text() : ""; }).then(function(t){
        var m = /<meta name="app-versao" content="([^"]+)"/.exec(t || ""); if (!m || m[1] === minha) return;
        avisado = true;
        var b = document.createElement("div"); b.setAttribute("role", "alert");
        b.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#151a23;color:#fff;border:1px solid #e11d48;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)";
        b.innerHTML = '🔄 Há uma versão nova desta página. <button type="button" style="font:inherit;font-weight:700;padding:6px 12px;border-radius:7px;border:0;background:#e11d48;color:#fff;cursor:pointer">Atualizar</button>';
        b.querySelector("button").addEventListener("click", function(){ location.reload(); });
        document.body.appendChild(b);
      }).catch(function(){});
    }
    setTimeout(conferir, 20000); setInterval(conferir, 300000);
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") conferir(); });
  })();
  window.__sol = { estado: function(){ return S; } };
})();
</script>
