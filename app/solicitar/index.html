<style>
  :root{
    --bg:#070a10; --surface:#0f141c; --surface-2:#151b24; --surface-3:#1b222c;
    --border:#232c38; --border-strong:#374353;
    --text:#e8ecf2; --text-muted:#aeb9c7; --text-faint:#919dad;
    --accent:#ff3d6e; --accent-strong:#ff7a99; --accent-soft:#2a0f1a; --accent-btn:#e11d48;
    --success:#38c793; --success-soft:#0f2620;
    --warning:#e7ac55; --warning-soft:#2c2211;
    --danger:#ff8a5c; --danger-soft:#2d1810;
    --info:#b794f6; --info-soft:#201733;
    --neutral:#9aa6b6; --neutral-soft:#1a212b;
    --shadow:0 4px 14px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.35);
    --radius:10px;
    color-scheme:dark;
  }
  /* tema claro (botão ☀️ no topo): melhor para ler no sol */
  :root[data-tema="claro"]{
    --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#e9edf2;
    --border:#d9dee6; --border-strong:#b9c1cc;
    --text:#0f172a; --text-muted:#3f4b5b; --text-faint:#5b6676;
    --accent:#be123c; --accent-strong:#9f1239; --accent-soft:#fde8ee; --accent-btn:#be123c;
    --success:#0b6e49; --success-soft:#dbf3e7;
    --warning:#8a5300; --warning-soft:#fcefd6;
    --danger:#b3340a; --danger-soft:#fde3d8;
    --info:#6427c9; --info-soft:#efe6fd;
    --neutral:#3f4b5b; --neutral-soft:#e8ecf1;
    --shadow:0 2px 8px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.06);
    color-scheme:light;
  }
  :root[data-tema="claro"] .linha input[type=date]{color-scheme:light;}
  :root[data-tema="claro"] .top{box-shadow:0 1px 0 var(--border);}
  :root[data-tema="claro"] #carregando{background:rgba(238,241,245,.75);}
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.5; letter-spacing:.1px;}
  h1,h2,h3{margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  [hidden]{display:none !important;}

  /* ---------- Entrada por chave ---------- */
  #login{min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:#060a12 url("../login-bg.webp") center center / cover no-repeat;}
  .login-card{width:100%; max-width:380px; background:rgba(12,17,25,.82); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); border:1px solid rgba(255,255,255,.07); border-radius:var(--radius);
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,61,110,.05); padding:28px 24px;}
  .login-brand{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px;}
  .mark{width:44px; height:44px; border-radius:10px; background:linear-gradient(155deg,#ff3d6e,#c0153f); box-shadow:0 4px 16px rgba(255,61,110,.35); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; margin-bottom:10px;}
  .login-brand h1{font-size:17px; font-weight:700;}
  .login-brand p{margin:2px 0 0; font-size:13px; color:var(--text-muted);}
  .field label{display:block; font-size:11px; font-weight:600; color:var(--text-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field-input{display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); border-radius:6px; padding:9px 11px; background:var(--surface);}
  .field-input:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,61,110,.16);}
  .field-input input{border:none; outline:none; background:transparent; font-size:14px; width:100%; color:var(--text); font-family:inherit; letter-spacing:.06em;}
  .eye{flex:none; background:none; border:none; padding:2px 4px; margin:0 -4px 0 0; color:var(--text-muted); display:flex; align-items:center; border-radius:6px;}
  .eye:hover{color:var(--accent-strong);} .eye:focus-visible{outline:2px solid var(--accent);}
  .btn{border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text); border-radius:6px; padding:8px 14px; font-size:12.5px; font-weight:600; transition:border-color .12s, background .12s, color .12s;}
  .btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary{width:100%; background:var(--accent-btn); color:#fff; border:none; border-radius:6px; padding:10px; font-size:13px; font-weight:600; margin-top:14px; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .btn-primary:hover:not(:disabled){filter:brightness(1.12); background:var(--accent-btn); color:#fff;}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary.inline{width:auto; padding:10px 22px; margin-top:0;}
  .btn.ok{border-color:var(--success); color:var(--success); background:var(--success-soft);}
  .btn.ruim{color:var(--danger);}
  .login-note{margin:12px 0 0; text-align:center; font-size:12px; color:var(--text-faint); min-height:1.4em;}
  .login-note.bad{color:var(--danger);}

  /* ---------- Estrutura ---------- */
  .top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:12px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top, 0px)); background:var(--surface); border-bottom:1px solid var(--border); box-shadow:0 1px 0 var(--border), 0 4px 14px rgba(0,0,0,.10);}
  .top .mark{width:34px; height:34px; font-size:13px; margin:0; flex:none;}
  .top-t{flex:1; min-width:0;}
  .top-t strong{display:block; font-size:14px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .top-t span{display:block; font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .relogio{flex:none; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .relogio.aberto{color:var(--success); background:var(--success-soft);}
  .relogio.fechado{color:var(--danger); background:var(--danger-soft);}
  main{max-width:960px; margin:0 auto; padding:18px 16px calc(40px + env(safe-area-inset-bottom, 0px));}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px;}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:15px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .card-head h2{font-size:14px; font-weight:700; letter-spacing:.01em;}
  .card-head p{margin:3px 0 0; font-size:12.5px; color:var(--text-muted);}
  .pad{padding:16px 18px;}
  .muted{color:var(--text-muted);} .faint{color:var(--text-faint);}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; letter-spacing:.01em;}
  .badge.success{background:var(--success-soft); color:var(--success);}
  .badge.warning{background:var(--warning-soft); color:var(--warning);}
  .badge.danger{background:var(--danger-soft); color:var(--danger);}
  .badge.info{background:var(--info-soft); color:var(--info);}
  .badge.neutral{background:var(--neutral-soft); color:var(--neutral);}

  .aviso{padding:12px 16px; border-radius:8px; font-size:13px; font-weight:600; margin-bottom:14px; border:1px solid transparent; line-height:1.5;}
  .aviso.ok{background:var(--success-soft); color:var(--success); border-color:rgba(56,199,147,.3);}
  .aviso.bad{background:var(--danger-soft); color:var(--danger); border-color:rgba(255,138,92,.3);}
  .aviso.warn{background:var(--warning-soft); color:var(--warning); border-color:rgba(231,172,85,.3);}
  .aviso.info{background:var(--info-soft); color:var(--info); border-color:rgba(183,148,246,.3);}
  .aviso .acoes{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;}
  .aviso input[type=text]{flex:1; min-width:180px; background:var(--surface); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:8px 10px; font-size:13px; font-family:inherit;}

  /* ---------- Editor de linhas ---------- */
  .linhas-cab, .linha{display:grid; grid-template-columns:minmax(200px,1.8fr) minmax(90px,.6fr) minmax(150px,1fr) minmax(110px,.7fr) 40px; gap:10px; align-items:center;}
  .linhas-cab{padding:0 0 6px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint);}
  .linha{margin-bottom:10px;}
  .linha select, .linha input{width:100%; height:40px; background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:0 10px; font-size:14px; font-family:inherit;}
  .linha select:focus, .linha input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,61,110,.16);}
  .linha input[type=date]{color-scheme:dark;}
  .linha .rm{height:40px; width:40px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-muted); border-radius:6px; font-size:16px; line-height:1;}
  .linha .rm:hover:not(:disabled){border-color:var(--danger); color:var(--danger); background:var(--danger-soft);}
  .linha .campo-erro{border-color:var(--danger) !important; box-shadow:0 0 0 3px rgba(255,138,92,.22) !important;}
  .erro-linha{grid-column:1 / -1; margin:-2px 0 0; font-size:12.5px; font-weight:600; color:var(--danger);}
  .linha .lbl, .linha .lt{display:none;}
  .desfazer{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 10px; padding:8px 12px; border-radius:8px; background:var(--surface-2); border:1px dashed var(--border-strong); font-size:12.5px; color:var(--text-muted);}
  .desfazer .btn{padding:5px 12px;}
  /* aviso fixo no topo: pedido digitado e ainda não enviado */
  .pendente{flex:1 1 100%; display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:8px; font-size:12.5px; font-weight:700; background:var(--warning-soft); color:var(--warning); border:1px solid rgba(231,172,85,.45);}
  .pendente.urgente{background:var(--danger-soft); color:var(--danger); border-color:rgba(255,138,92,.6); animation:pisca 1.6s ease-in-out infinite;}
  @keyframes pisca{50%{box-shadow:0 0 0 3px rgba(255,138,92,.25);}}
  .pendente .btn{padding:5px 12px; font-size:12px;}
  .top{flex-wrap:wrap;}
  .ce-sec{margin:10px 0 0;} .ce-sec ul{margin:4px 0 0; padding-left:0; list-style:none;} .ce-sec li{margin:3px 0; display:flex; gap:8px; align-items:baseline;}
  .ce-ic{flex:none; width:22px; text-align:center; font-weight:800;}
  .ce-entra .ce-ic{color:var(--success);} .ce-sai{color:var(--danger);} .ce-sai s{opacity:.85;} .ce-muda .ce-ic{color:var(--info);} .ce-fica{color:var(--text-muted); font-weight:500;}
  .linhas-box.off{opacity:.4; pointer-events:none;}
  .acoes-editor{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:6px;}
  .acoes-editor .grow{flex:1;}
  .sem-btn[aria-pressed=true]{border-color:var(--info); color:var(--info); background:var(--info-soft);}
  .msg-erro{margin:6px 0 0; font-size:12.5px; color:var(--danger); min-height:1.2em;}
  .status-env{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;}

  /* ---------- Histórico e lista ---------- */
  details.hist summary{cursor:pointer; padding:14px 18px; font-size:13.5px; font-weight:700; list-style:none; display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px;}
  .hist-t{display:inline-flex; align-items:center; gap:8px; white-space:nowrap;}
  .hist-sub{font-weight:500; font-size:12.5px; color:var(--text-faint);}
  .nota-sem, .nota-dom{margin:8px 0 0; font-size:12.5px; color:var(--text-muted);}
  .nota-dom{grid-column:1 / -1; margin:0; color:var(--warning); font-weight:600;}
  details.hist summary::-webkit-details-marker{display:none;}
  details.hist summary::before{content:"▸"; color:var(--text-faint); transition:transform .12s;}
  details.hist[open] summary::before{transform:rotate(90deg);}
  .v{padding:12px 18px; border-top:1px solid var(--border);}
  .manter{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin:2px 0 12px; cursor:pointer;}
  .manter input{width:18px; height:18px; accent-color:var(--accent);}
  .btn.instalar{width:100%; margin-top:14px; min-height:44px;}
  .v-top{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:4px; font-size:12.5px;}
  .v-linhas{font-size:12.5px; color:var(--text-muted);}
  .hz-dia{border-top:1px solid var(--border);}
  .hz-lista{list-style:none; margin:0; padding:2px 18px 12px 18px;}
  .hz-ev{display:grid; grid-template-columns:92px 22px 1fr; gap:6px; align-items:start; padding:6px 0 6px 10px; border-left:2px solid var(--border); font-size:12.5px; line-height:1.45;}
  .hz-hora{color:var(--text-faint); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .hz-ic{text-align:center;}
  .hz-por{color:var(--text-faint);}
  .hz-txt s{opacity:.7;}
  .hz-env{border-left-color:var(--info, #60a5fa);} .hz-mud, .hz-ped{border-left-color:var(--warning);} .hz-ok{border-left-color:var(--success);} .hz-ok .hz-txt b{color:var(--success);}
  .hz-neg, .hz-canc{border-left-color:var(--danger);} .hz-neg .hz-txt b, .hz-canc .hz-txt b{color:var(--danger);}
  .v-apagada .v-linhas{text-decoration:line-through; opacity:.75;}
  .tabela{width:100%; border-collapse:collapse;}
  .tabela th{padding:9px 14px; text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); border-bottom:1px solid var(--border); white-space:nowrap;}
  .tabela td{padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  .tabela tr:last-child td{border-bottom:none;}
  .scroll-x{overflow-x:auto;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); gap:10px; margin-bottom:16px;}
  .stat{text-align:left; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--st, var(--border-strong)); border-radius:8px; padding:10px 14px; color:var(--text);}
  .stat b{display:block; font-size:22px; line-height:1.15; font-variant-numeric:tabular-nums;}
  .stat span{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted);}
  button.stat:hover, .stat.sel{border-color:var(--accent); background:var(--accent-soft);}
  .aut-item{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border);}
  .aut-item:first-of-type{border-top:none;}
  .aut-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .aut-btns .btn-primary{margin-top:0;}
  .aut-item .info{min-width:0; flex:1 1 220px;}
  .aut-item .info b{display:block; font-size:13.5px;}
  .aut-item .info span{font-size:12px; color:var(--text-muted);}
  .voltar{margin-bottom:14px;}
  .pick{display:flex; flex-wrap:wrap; gap:10px; padding:14px 18px; align-items:center;}
  .pick select{flex:1 1 260px; min-width:0; height:40px; background:var(--surface-2); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:0 10px; font-size:14px; font-family:inherit;}
  .pick .btn-primary{flex:0 0 auto;}
  .centro{padding:30px 18px; text-align:center; color:var(--text-muted);}
  .so-mobile{display:none; margin-top:6px; font-size:12.5px; color:var(--text-muted); line-height:1.45;}
  .dica-filtro{margin:-8px 0 14px; font-size:12px; color:var(--text-faint);}
  .voltar-fim{margin:4px 0 0;}
  button.stat{cursor:pointer;}

  /* ---------- Pedido programado (travado) e Meus pedidos ---------- */
  .linha.travada{display:block; padding:11px 14px; border:1px solid rgba(56,199,147,.35); background:var(--success-soft); border-radius:8px; font-size:13px; line-height:1.5;}
  .linha.travada b{color:var(--text);}
  .mp-dia{border-top:1px solid var(--border);}
  .mp-dia:first-child{border-top:none;}
  .mp-dia-cab{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 18px 6px; font-size:13px; font-weight:700;}
  .mp-linha{padding:8px 18px 12px; display:flex; flex-direction:column; gap:6px;}
  .confirma-envio{margin-top:12px;} .confirma-envio ul{margin:4px 0 0; padding-left:18px;} .confirma-envio li{margin:2px 0;}
  .ce-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin:10px 0;} .ce-tit{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; opacity:.8;}
  .mp-cancelado b{text-decoration:line-through; color:var(--text-muted, #64748b);}
  .mp-topo{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13.5px;}
  .mp-cargas{display:flex; flex-direction:column; gap:4px; padding-left:4px;}
  .mp-carga{display:flex; flex-wrap:wrap; gap:2px 10px; align-items:center; font-size:13px; color:var(--text-muted); padding:3px 0;}
  .mp-carga-l{display:inline-flex; flex-wrap:nowrap; gap:8px; align-items:center;}
  .mp-carga-f{font-size:12.5px;}
  .mp-carga .placa{font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; color:var(--text); letter-spacing:.03em;}
  .mp-acoes{display:flex; flex-wrap:wrap; gap:8px;}
  .mp-acoes .btn{padding:6px 12px; font-size:12.5px;}
  .mp-form{border:1px solid var(--border-strong); border-radius:8px; padding:12px 14px; background:var(--surface-2); display:flex; flex-direction:column; gap:10px;}
  .mp-form .campos{display:flex; flex-wrap:wrap; gap:10px;}
  .mp-form label{display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); flex:1 1 140px;}
  .mp-form select, .mp-form input, .mp-form textarea{width:100%; background:var(--surface); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:8px 10px; font-size:14px; font-family:inherit; text-transform:none; letter-spacing:0; font-weight:400;}
  .mp-form textarea{min-height:64px; resize:vertical;}
  .mp-alt{padding:10px 18px; border-top:1px solid var(--border); font-size:12.5px; display:flex; flex-direction:column; gap:3px;}

  #carregando{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(7,10,16,.7); color:var(--text-muted); font-size:13px;}

  @media (max-width:600px){
    .linhas-cab{display:none;}
    .linha{grid-template-columns:1fr 1fr; gap:8px 10px; padding:10px 12px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface);}
    .linha .lt{display:block; grid-column:1; order:0; align-self:center; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint);}
    .linha .rm{grid-column:2; order:0; justify-self:end; width:auto; height:30px; padding:0 10px; font-size:12px; font-weight:600; color:var(--danger); border-color:rgba(255,138,92,.35);}
    .linha .rm::after{content:" Remover";}
    .linha .lbl{display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:0 0 3px;}
    .linha .m{grid-column:1 / -1; order:1;}
    .linha .c{grid-column:1; order:2;} .linha .p{grid-column:2; order:3;}
    .linha .d{grid-column:1 / -1; order:4;}

  }

<body>

<div id="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">CL</div>

      <p>Solicitação de Cimento</p>
    </div>

          <span aria-hidden="true">🔑</span>

          <button type="button" class="eye" id="olho" aria-label="Mostrar chave" aria-pressed="false" title="Mostrar/ocultar a chave"><svg id="olhoIc" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <label class="manter"><input type="checkbox" id="manter"> Manter conectado neste aparelho</label>
      <button class="btn-primary" type="submit" id="entrar">Entrar</button>
      <p class="login-note" id="loginMsg" role="alert"></p>
      <p class="login-note" style="margin-top:4px">A chave foi entregue pela Logística. Cada usina tem a sua.</p>
      <button type="button" class="btn instalar" id="btnInstalar" hidden>📲 Instalar no celular (ícone na tela inicial)</button>
      <p class="login-note instalar-ios" id="dicaIos" hidden>📲 Para ter o ícone no iPhone: toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>.</p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="mark">CL</div>
    <div class="top-t"><strong id="quem"></strong><span id="quemSub"></span></div>
    <span class="relogio" id="relogio" title=""></span>
    <button class="btn" id="tema" title="Tela clara / escura" aria-label="Trocar entre tela clara e escura">☀️</button>
    <button class="btn" id="atualizar" title="Buscar dados novos">↻</button>
    <button class="btn" id="sair">Sair</button>
    <div class="pendente" id="pendente" role="status" hidden><span id="pendenteTxt"></span><button type="button" class="btn" id="pendenteBtn">Ir para o pedido</button></div>
  </header>
  <main id="conteudo"></main>
</div>
<div id="carregando">Carregando…</div>

<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script>
(function(){
  "use strict";
  var CFG = window.CONFIG;
  var sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  var MATERIAIS = ["CP2", "CP3", "CP5", "POZOLANA"];
  var CAT_NOME = { CP2: "CP II", CP3: "CP III", CP5: "CP V", POZOLANA: "Pozolana" };
  /* Materiais da usina: os cimentos dela no Controle de cimento (fábrica específica, ex. "Cimento Tupi — CP II E 40 RS").
     Usina sem cimento cadastrado: os tipos genéricos (CP II, CP III, CP V, Pozolana). Valor do select: "f:<fábrica>" ou "m:<tipo>". */
  function opcoesUsina(){ return (S.estado && Array.isArray(S.estado.opcoes)) ? S.estado.opcoes : []; }
  function rotuloMat(m, f){ return f ? f : (CAT_NOME[m] || m || ""); }
  function valMat(l){ return l.fabrica ? "f:" + l.fabrica : (l.material ? "m:" + l.material : ""); }
  function aplicarMat(l, v){
    v = String(v || "");
    if (v.indexOf("f:") === 0){ var f = v.slice(2), o = opcoesUsina().find(function(x){ return x.f === f; }); l.fabrica = f; if (o) l.material = o.m; }
    else if (v.indexOf("m:") === 0){ l.fabrica = ""; l.material = v.slice(2); }
    else { l.fabrica = ""; l.material = ""; }
  }
  function fmtCurta(iso){ var p = String(iso || "").split("-"); return p.length === 3 ? p[2] + "/" + p[1] : ""; }
  function opcoesMatHtml(atual, excluir){
    var op = opcoesUsina(), h = '<option value="">Material…</option>';
    if (op.length){
      MATERIAIS.forEach(function(m){
        var g = op.filter(function(o){ return o.m === m && "f:" + o.f !== excluir; }); if (!g.length) return;
        h += '<optgroup label="' + CAT_NOME[m] + '">' + g.map(function(o){
          return '<option value="f:' + esc(o.f) + '"' + (atual === "f:" + o.f ? " selected" : "") + '>' + esc(o.f) + (o.troca ? " · troca " + (o.data ? fmtCurta(o.data) : "marcada") : "") + '</option>'; }).join("") + '</optgroup>';
      });
      if (atual && atual !== excluir && !op.some(function(o){ return "f:" + o.f === atual; })){   // pedido antigo (só o tipo) ou cimento que saiu da usina
        var leg = atual.indexOf("f:") === 0 ? atual.slice(2) : (CAT_NOME[atual.slice(2)] || atual.slice(2));
        h += '<option value="' + esc(atual) + '" selected>' + esc(leg) + '</option>';
      }
    } else {
      h += MATERIAIS.filter(function(m){ return "m:" + m !== excluir; }).map(function(m){ return '<option value="m:' + m + '"' + (atual === "m:" + m ? " selected" : "") + '>' + CAT_NOME[m] + '</option>'; }).join("");
    }
    return h;
  }
  var SP = "America/Sao_Paulo";
  var S = { chave: "", tipo: "", nome: "", d: null, estado: null, usinaSel: null, linhas: [], sem: false, sujo: false, msg: "", msgTipo: "", enviando: false, offset: 0, filtro: "todas", motivo: "", confirmaNegar: null, abertoHist: false };
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* ---------- Armazenamento (só durante a aba aberta) ---------- */
  // "Manter conectado neste aparelho": guarda a chave no aparelho (some ao tocar em Sair). Sem marcar, só vale até fechar o navegador.
  function manterMarcado(){ var m = document.getElementById("manter"); return !!(m && m.checked); }
  function guardar(c){
    try { if (c) sessionStorage.setItem("sol_chave", c); else sessionStorage.removeItem("sol_chave"); } catch (e) { }
    try { if (c && manterMarcado()) localStorage.setItem("sol_chave_m", c); else if (!c) localStorage.removeItem("sol_chave_m"); } catch (e) { }
  }
  function lembrada(){ try { return sessionStorage.getItem("sol_chave") || localStorage.getItem("sol_chave_m") || ""; } catch (e) { return ""; } }
  // instalar como app (ícone na tela inicial)
  (function(){
    var app = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    var celular = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    var m = document.getElementById("manter"); if (m) m.checked = !!(app || celular);
    if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) { } }
    if (app) return;
    var ev = null, b = document.getElementById("btnInstalar");
    window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); ev = e; if (b) b.hidden = false; });
    if (b) b.addEventListener("click", function(){ if (!ev) return; ev.prompt(); ev.userChoice.then(function(){ ev = null; b.hidden = true; }); });
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent || "");
    if (ios){ var d = document.getElementById("dicaIos"); if (d) d.hidden = false; }
  })();

  /* ---------- Relógio de Brasília (do servidor) ---------- */
  function agoraMs(){ return Date.now() + S.offset; }
  function partesSP(ms){
    var f = new Intl.DateTimeFormat("en-CA", { timeZone: SP, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false });
    var o = {}; f.formatToParts(new Date(ms)).forEach(function(p){ o[p.type] = p.value; });
    var h = parseInt(o.hour, 10); if (h === 24) h = 0;
    return { dia: o.year + "-" + o.month + "-" + o.day, h: h, m: parseInt(o.minute, 10) };
  }
  function hojeCivil(){ return partesSP(agoraMs()).dia; }
  function amanha(){ var p = hojeCivil().split("-"); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + 1)); if (d.getUTCDay() === 0) d.setUTCDate(d.getUTCDate() + 1); return d.toISOString().slice(0, 10); }   // domingo → segunda
  function ehDomingo(iso){ var p = String(iso || "").split("-"); return p.length === 3 && new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay() === 0; }
  function prazoAbertoLocal(){ var p = partesSP(agoraMs()), min = p.h * 60 + p.m; return min >= 120 && min < 960; }
  function fmtHora(ms){ return new Intl.DateTimeFormat("pt-BR", { timeZone: SP, hour: "2-digit", minute: "2-digit" }).format(new Date(ms)); }
  function fmtDiaHora(iso){ var d = new Date(iso); if (isNaN(d)) return ""; var o = { timeZone: SP }; return new Intl.DateTimeFormat("pt-BR", { timeZone: SP, day: "2-digit", month: "2-digit" }).format(d) + " " + fmtHora(d.getTime()); }
  var SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  function fmtData(iso){ var p = String(iso).split("-"); if (p.length < 3) return iso; var d = new Date(+p[0], +p[1] - 1, +p[2]); return p[2] + "/" + p[1] + " (" + SEM[d.getDay()] + ")"; }
  function faltam(minutos){ var h = Math.floor(minutos / 60), m = minutos % 60; return (h ? h + " h " : "") + m + " min"; }
  function textoRelogio(){
    var p = partesSP(agoraMs()), min = p.h * 60 + p.m, aberto = min >= 120 && min < 960;
    var hh = ("0" + p.h).slice(-2) + ":" + ("0" + p.m).slice(-2);
    var t = aberto ? "Aberto · fecha às 16:00 (faltam " + faltam(960 - min) + ")" : (min >= 960 ? "Prazo encerrado · abre de novo amanhã" : "Prazo encerrado · abre às 2h");
    return { aberto: aberto, txt: t, hh: hh };
  }

  /* ---------- Chamadas ---------- */
  var ERROS = { chave_invalida: "Chave inválida ou desativada. Confira com a Logística.", bloqueado: "Muitas tentativas erradas. Aguarde 10 minutos e tente de novo." };
  function erroTxt(e){
    var m = (e && e.message) || "";
    if (/failed to fetch|networkerror|load failed/i.test(m)) return "Sem conexão com a internet ou com o sistema. Tente de novo.";
    if (/timeout|timed out|statement|canceling/i.test(m)) return "O sistema demorou para responder. Tente de novo em alguns segundos.";
    if (!m || /violates|constraint|syntax|relation |column |function |permission denied|jwt|duplicate key|null value|operator|invalid input|PGRST|schema|^\d{3}\b/i.test(m) || /[{}]/.test(m))
      return "Não foi possível concluir agora (erro do sistema). Tente de novo; se continuar, avise a Logística." + (e && e.code ? " [código " + e.code + "]" : "");
    return m;
  }
  async function chamar(fn, args){
    var r = await sb.rpc(fn, args);
    if (r.error) throw r.error;
    return r.data || {};
  }
  function carregando(on){ $("carregando").style.display = on ? "flex" : "none"; }

  /* ---------- Entrada ---------- */
  function msgLogin(t, bad){ var m = $("loginMsg"); m.textContent = t || ""; m.className = "login-note" + (bad ? " bad" : ""); }
  $("olho").addEventListener("click", function(){
    var i = $("chave"), ver = i.type === "password"; i.type = ver ? "text" : "password";
    this.setAttribute("aria-pressed", ver ? "true" : "false"); this.setAttribute("aria-label", ver ? "Ocultar chave" : "Mostrar chave"); i.focus();
  });
  $("loginForm").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var c = $("chave").value; if (!c.trim()) return;
    $("entrar").disabled = true; msgLogin("Entrando…");
    try {
      var ok = await entrar(c);
      if (ok){ $("chave").value = ""; $("chave").type = "password"; msgLogin(""); }
    } catch (e) { msgLogin(erroTxt(e), true); }
    $("entrar").disabled = false;
  });
  async function entrar(chave){
    var d = await chamar("solic_k_estado", { p_chave: chave });
    if (d.erro){ msgLogin(ERROS[d.erro] || "Não foi possível entrar.", true); guardar(""); return false; }
    S.chave = chave; S.tipo = d.tipo; guardar(chave);
    S.offset = 0; S.usinaSel = null; S.selUsina = ""; S.msg = ""; S.sujo = false; S.filtro = "todas";
    aplicar(d, true);
    $("login").hidden = true; $("app").hidden = false;
    window.scrollTo(0, 0);
    iniciarRelogio();
    return true;
  }
  function sair(){
    guardar(""); S.chave = ""; S.d = null; S.estado = null; S.desfazer = null; $("pendente").hidden = true; S.mp = null; S.mpForm = null; clearInterval(S.rel); clearInterval(S.poll);
    $("app").hidden = true; $("login").hidden = false; $("conteudo").innerHTML = ""; msgLogin("");
  }
  $("sair").addEventListener("click", function(){
    if (temNaoEnviado() && !window.confirm("Você tem um pedido que ainda NÃO foi enviado. Se sair agora, ele se perde.\n\nSair mesmo assim?")) return;
    sair();
  });
  $("atualizar").addEventListener("click", function(){
    if (temNaoEnviado() && !window.confirm("Atualizar agora apaga o que você digitou e ainda não enviou.\n\nAtualizar mesmo assim?")) return;
    recarregar(true);
  });
  (function(){   // tema claro/escuro, guardado neste aparelho
    var aplicarTema = function(t){ if (t === "claro") document.documentElement.setAttribute("data-tema", "claro"); else document.documentElement.removeAttribute("data-tema");
      $("tema").textContent = t === "claro" ? "🌙" : "☀️"; var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "claro" ? "#ffffff" : "#070a10"; };
    var t0 = ""; try { t0 = localStorage.getItem("sol_tema") || ""; } catch (e) { }
    aplicarTema(t0);
    $("tema").addEventListener("click", function(){ var t = document.documentElement.getAttribute("data-tema") === "claro" ? "" : "claro"; try { localStorage.setItem("sol_tema", t); } catch (e) { } aplicarTema(t); });
  })();
  $("pendenteBtn").addEventListener("click", function(){
    var alvo = !podeEditar() ? document.querySelector('[data-act="pedir"]') : document.querySelector('[data-act="enviar"]');
    if (!alvo) return; alvo.scrollIntoView({ block: "center", behavior: "smooth" });
    if (podeEditar() && /Enviar agora/.test(this.textContent)) enviar(false); else try { alvo.focus({ preventScroll: true }); } catch (e) { }
  });

  /* ---------- Estado ---------- */
  function aplicar(d, inicial){
    S.d = d;
    var est = d.tipo === "usina" ? d.estado : d.estado;
    var agora = (est && est.agora_ms) || (d.painel && d.painel.agora_ms);
    if (agora) S.offset = agora - Date.now();
    if (d.tipo === "encarregado") S.nome = d.nome;
    S.estado = est || null;
    if (est && (inicial || !S.sujo)) puxarLinhas(est);
    desenhar();
    if (est) carregarMeus();
  }
  async function carregarMeus(){
    var alvo = S.tipo === "encarregado" ? S.usinaSel : "usina";
    if (!S.chave || !alvo) return;
    try {
      var d = await chamar("solic_k_meus_pedidos", { p_chave: S.chave, p_usina: S.tipo === "encarregado" ? S.usinaSel : null });
      if (d.erro) return;
      if ((S.tipo === "encarregado" ? S.usinaSel : "usina") !== alvo) return;   // trocou de usina enquanto carregava
      S.mp = d;
      if (!S.mpForm && !focoEmCampo()) desenhar();
    } catch (e) { }
  }
  function puxarLinhas(est){
    var env = est.envio;
    if (env && !env.sem_necessidade && env.linhas.length) S.linhas = env.linhas.map(function(l){
      var q = (l.prog && l.prog.qtd) || 0;
      return { id: l.id, material: l.material, fabrica: l.fabrica || "", carretas: String(l.carretas), data: String(l.data_desejada).slice(0, 10), periodo: l.periodo || "",
               travada: q > 0, progQtd: q, adicional: !!l.adicional, alterada: !!l.alterada };
    });
    else S.linhas = [novaLinha()];
    S.sem = !!(env && env.sem_necessidade);
    S.sujo = false;
  }
  function novaLinha(){ return { material: "", fabrica: "", carretas: "", data: amanha(), periodo: "" }; }
  /* ---------- Pedido digitado e ainda não enviado ---------- */
  function chaveLinha(material, fabrica, data, periodo){ return [material || "", fabrica || "", String(data || "").slice(0, 10), periodo || ""].join("|"); }
  function assinaturaTela(){
    if (S.sem) return "SEM";
    return S.linhas.filter(function(l){ return l.travada || l.material || l.carretas; })
      .map(function(l){ return chaveLinha(l.material, l.fabrica, l.data, l.periodo) + "|" + Number(l.carretas || 0); }).sort().join(";");
  }
  function assinaturaEnviada(){
    var env = S.estado && S.estado.envio; if (!env) return "";
    if (env.sem_necessidade) return "SEM";
    return (env.linhas || []).map(function(l){ return chaveLinha(l.material, l.fabrica, l.data_desejada, l.periodo) + "|" + Number(l.carretas || 0); }).sort().join(";");
  }
  function noEditor(){ return !!(S.d && S.estado && (S.tipo === "usina" || S.usinaSel)); }
  function temNaoEnviado(){ return noEditor() && !S.enviando && assinaturaTela() !== assinaturaEnviada(); }
  function podeEditar(){
    var est = S.estado; if (!est) return false;
    var aut = est.autorizacao, vig = !!(aut && aut.vigente && new Date(aut.valida_ate).getTime() > agoraMs());
    return !!(est.prazo_aberto || vig || S.tipo === "encarregado");
  }
  function pintarPendente(){
    var b = $("pendente"); if (!b) return;
    if (!temNaoEnviado()){ b.hidden = true; return; }
    var p = partesSP(agoraMs()), min = p.h * 60 + p.m, aberto = min >= 120 && min < 960, t, urg = false, btn = "Ir para o pedido";
    if (!podeEditar()){ t = "⚠ O prazo fechou e o seu pedido NÃO foi enviado. Peça autorização ao encarregado."; urg = true; btn = "Pedir autorização"; }
    else if (aberto && S.tipo === "usina" && min >= 930){ t = "⚠ Pedido NÃO enviado — o prazo fecha em " + faltam(960 - min) + ". Envie agora."; urg = true; btn = "Enviar agora"; }
    else t = "● Você mudou o pedido e ainda NÃO enviou.";
    $("pendenteTxt").textContent = t; $("pendenteBtn").textContent = btn;
    b.className = "pendente" + (urg ? " urgente" : ""); b.hidden = false;
  }
  window.addEventListener("beforeunload", function(ev){ if (temNaoEnviado()){ ev.preventDefault(); ev.returnValue = ""; return ""; } });
  async function recarregar(manual){
    if (!S.chave) return;
    try {
      var d = await chamar("solic_k_estado", { p_chave: S.chave, p_usina: S.tipo === "encarregado" ? S.usinaSel : null });
      if (d.erro){ sair(); msgLogin(ERROS[d.erro] || "Sessão encerrada.", true); return; }
      if (manual){ S.msg = ""; S.sujo = false; }
      aplicar(d, !!manual);
    } catch (e) { if (manual){ S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); } }
  }
  function iniciarRelogio(){
    clearInterval(S.rel); clearInterval(S.poll);
    var antes = prazoAbertoLocal();
    S.rel = setInterval(function(){
      pintarRelogio();
      var agora = prazoAbertoLocal();
      var est = S.estado, venceu = est && est.autorizacao && est.autorizacao.vigente && new Date(est.autorizacao.valida_ate).getTime() < agoraMs();
      if (agora !== antes || venceu){ antes = agora; recarregar(false); }
    }, 15000);
    S.poll = setInterval(function(){ if (document.visibilityState === "visible" && !S.enviando && !focoEmCampo() && !S.mpForm) recarregar(false); }, 30000);
    pintarRelogio();
  }
  function focoEmCampo(){ var a = document.activeElement; return !!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); }
  window.addEventListener("focus", function(){ if (S.chave && !S.enviando) recarregar(false); });
  function pintarRelogio(){
    pintarPendente();
    var r = textoRelogio(), el = $("relogio");
    el.textContent = r.hh + " · " + r.txt; el.className = "relogio " + (r.aberto ? "aberto" : "fechado");
    el.title = "Horário de Brasília. A usina pede até as 16:00 do dia; depois disso, só com autorização do encarregado.";
  }

  /* ---------- Desenho ---------- */
  function desenhar(){
    var d = S.d; if (!d) return;
    var topo = d.tipo === "usina" ? ["Usina " + d.estado.usina.nome, d.estado.usina.encarregado ? "Encarregado: " + d.estado.usina.encarregado : "Solicitação de cimento"] : ["Encarregado " + d.nome, "Solicitações das suas usinas"];
    $("quem").textContent = topo[0]; $("quemSub").textContent = topo[1];
    pintarRelogio();
    var foco = guardarFoco();
    var h = "";

  /* Histórico dos pedidos: tudo o que aconteceu, separado por data de entrega e em ordem de hora.

  function mudancasEnvio(env){
    var trav = [], travD = {}, antes = [], depois = [];
    S.linhas.forEach(function(l){ if (l.travada){ trav.push(l); travD[l.data] = 1; } });
    if (env && !env.sem_necessidade) (env.linhas || []).forEach(function(l){
      if (l.prog && l.prog.qtd > 0) return;
      antes.push({ id: l.id || "", m: l.material, f: l.fabrica || "", d: String(l.data_desejada).slice(0, 10), p: l.periodo || "", c: Number(l.carretas) });
    });
    if (!S.sem) S.linhas.forEach(function(l){ if (!l.travada) depois.push({ id: l.id || "", m: l.material, f: l.fabrica || "", d: l.data, p: l.periodo || "", c: Number(l.carretas || 0) }); });
    var k = function(x){ return chaveLinha(x.m, x.f, x.d, x.p); }, pares = [], usadoA = {};
    depois.forEach(function(n){   // mesma linha (pelo id) ou, se for linha nova, a antiga igual
      var a = -1;
      if (n.id) antes.forEach(function(o, ix){ if (a < 0 && !usadoA[ix] && o.id === n.id) a = ix; });
      if (a < 0) antes.forEach(function(o, ix){ if (a < 0 && !usadoA[ix] && k(o) === k(n)) a = ix; });
      if (a >= 0){ usadoA[a] = 1; pares.push({ o: antes[a], n: n }); } else pares.push({ o: null, n: n });
    });
    var out = { entra: [], sai: [], muda: [], fica: [], trav: trav };
    pares.forEach(function(pr){
      if (!pr.o) out.entra.push({ x: pr.n, c: pr.n.c, adicional: !!travD[pr.n.d] });
      else if (k(pr.o) === k(pr.n) && pr.o.c === pr.n.c) out.fica.push({ x: pr.n, c: pr.n.c });
      else out.muda.push({ o: pr.o, n: pr.n });

    var ord = function(a, b){ var da = (a.x || a.n).d, db = (b.x || b.n).d; return da < db ? -1 : da > db ? 1 : 0; };
    out.entra.sort(ord); out.sai.sort(ord); out.muda.sort(ord); out.fica.sort(ord);

    if (S.sem && !(env && env.sem_necessidade)) out.entra.unshift({ sem: true });
    return out;

    var nada = env && !itens;
    var h = '<div class="aviso ' + (nada ? "info" : "warn") + ' confirma-envio" id="confirmaEnvio" role="alertdialog" aria-label="Conferir antes de enviar">';
    if (nada) h += '<b>Nada mudou</b> em relação ao que já foi enviado' + (env ? " às " + esc(fmtHora(new Date(env.enviado_em).getTime())) : "") + '. Não é preciso enviar de novo.';
    else h += '<b>⚠️ Confira antes de enviar.</b> ' + (env ? 'O envio <b>substitui</b> a solicitação de hoje (versão ' + env.versao + '). Veja o que muda:' : 'Já existe pedido para ' + (Object.keys(datas).length > 1 ? "essas datas" : "esse dia") + ':') +
      (itens ? '<div class="ce-sec"><span class="ce-tit">O que muda</span><ul>' + itens + '</ul></div>' : "");
    if (fica) h += '<div class="ce-sec"><span class="ce-tit">Continua igual</span><ul>' + fica + '</ul></div>';
    if (outros) h += '<div class="ce-sec"><span class="ce-tit">Já pedido em outros dias para as mesmas datas</span><ul>' + outros + '</ul></div>';
    h += '<div class="acoes">' + (nada ? "" : '<button type="button" class="btn-primary inline" data-act="enviar-ok">✔ Confere, enviar</button>') + '<button type="button" class="btn" data-act="enviar-voltar">' + (nada ? "OK" : "Voltar e corrigir") + '</button></div></div>';
    return h;
  }
  async function enviar(confirmado){
    if (S.enviando) return;
    if (!confirmado && S.estado && S.estado.envio && !temNaoEnviado()){ S.confirmaEnvio = true; desenhar(); var c0 = $("confirmaEnvio"); if (c0) c0.scrollIntoView({ block: "center", behavior: "smooth" }); return; }   // nada mudou
    if (!S.sem){ var v = validar(); if (v){ marcarErro(v); return; } }
    marcarErro(null);
    var est0 = S.estado || {}, env0 = est0.envio;
    if (!confirmado && (env0 || jaPedido(null).length)){ S.confirmaEnvio = true; desenhar(); var cx = $("confirmaEnvio"); if (cx) cx.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    S.confirmaEnvio = false;
    S.enviando = true; S.msg = ""; desenhar();
    try {
      var args = { p_chave: S.chave, p_sem_necessidade: S.sem, p_linhas: S.sem ? [] : S.linhas.map(function(l){ return { id: l.id || null, material: l.material, fabrica: l.fabrica || null, carretas: Number(l.carretas), data_desejada: l.data, periodo: l.periodo || "" }; }) };
      if (S.tipo === "encarregado") args.p_usina = S.usinaSel;
      var d = await chamar("solic_k_enviar", args);
      if (d.erro){ S.enviando = false; sair(); msgLogin(ERROS[d.erro] || "Sessão encerrada.", true); return; }
      S.enviando = false; S.sujo = false; S.desfazer = null;
      var env = d.estado && d.estado.envio;
      S.msg = S.sem ? "Resposta registrada: sem necessidade de cimento." : "Solicitação enviada" + (env ? " (versão " + env.versao + ")" : "") + ".";
      if (!S.sem && env && env.fora_do_prazo){ S.msg += " Atenção: pedido feito depois das 16h — não há certeza da entrega deste pedido."; }
      S.msgTipo = "ok"; aplicar(d, true);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) {
      S.enviando = false; S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); window.scrollTo({ top: 0, behavior: "smooth" });
      recarregar(false);
    }
  }
  async function pedirAutorizacao(){
    try {
      var d = await chamar("solic_k_pedir_autorizacao", { p_chave: S.chave, p_motivo: ($("motivo") && $("motivo").value) || "" });
      if (d.erro){ sair(); msgLogin(ERROS[d.erro], true); return; }
      S.motivo = ""; S.msg = "Pedido enviado ao encarregado. Esta tela atualiza sozinha quando ele responder."; S.msgTipo = "ok"; aplicar(d, false);
    } catch (e) { S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); }
  }
  async function decidir(id, aprovar, abrir){
    try {
      var d = await chamar("solic_k_decidir", { p_chave: S.chave, p_id: id, p_aprovar: aprovar, p_usina: S.usinaSel });
      if (d.erro){ sair(); msgLogin(ERROS[d.erro], true); return; }
      S.confirmaNegar = null; S.msg = aprovar ? (abrir ? "Autorizado. Preencha o pedido desta usina abaixo." : "Liberado por 60 minutos.") : "Pedido negado."; S.msgTipo = "ok";
      if (abrir){ var msg = S.msg; await abrirUsina(abrir); S.msg = msg; S.msgTipo = "ok"; desenhar(); }
      else await recarregar(false);
    } catch (e) { S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); }
  }
  async function abrirUsina(id){
    S.usinaSel = id; S.msg = ""; S.sujo = false; S.mp = null; S.mpForm = null; carregando(true);
    try { var d = await chamar("solic_k_estado", { p_chave: S.chave, p_usina: id }); aplicar(d, true); window.scrollTo(0, 0); }
    catch (e) { S.usinaSel = null; S.msg = erroTxt(e); S.msgTipo = "bad"; desenhar(); }
    carregando(false);
  }

  $("conteudo").addEventListener("input", function(ev){
    var t = ev.target; if (t.id === "motivo"){ S.motivo = t.value; return; }
    if (S.mpForm && /^mp(Mat|Car|Per|Mot)$/.test(t.id)){ S.mpForm[{ mpMat: "material", mpCar: "carretas", mpPer: "periodo", mpMot: "motivo" }[t.id]] = t.value; S.mpForm.erro = ""; return; }
    if (t.dataset.i === undefined) return;
    if (t.dataset.f === "material") aplicarMat(S.linhas[+t.dataset.i], t.value); else S.linhas[+t.dataset.i][t.dataset.f] = t.value;
    S.sujo = true; marcarErro(null); pintarPendente();
  });
  $("conteudo").addEventListener("change", function(ev){
    var t = ev.target;
    if (S.mpForm && /^mp(Mat|Car|Per|Mot)$/.test(t.id)){ S.mpForm[{ mpMat: "material", mpCar: "carretas", mpPer: "periodo", mpMot: "motivo" }[t.id]] = t.value; return; }
    if (t.id === "selUsina"){ S.selUsina = t.value; var bt = document.querySelector('[data-act="abrir-sel"]'); if (bt) bt.disabled = !t.value; return; }
    if (t.dataset.i === undefined) return;
    if (t.dataset.f === "material") aplicarMat(S.linhas[+t.dataset.i], t.value); else S.linhas[+t.dataset.i][t.dataset.f] = t.value;
    S.sujo = true; pintarPendente();
    if (S.confirmaEnvio){ S.confirmaEnvio = false; desenhar(); }   // mudou o pedido: confere de novo ao enviar
    else if (t.dataset.f === "data" && !!document.querySelector('.linha[data-row="' + t.dataset.i + '"] .nota-dom') !== ehDomingo(t.value)) desenhar();
  });
  $("conteudo").addEventListener("wheel", function(ev){ var t = ev.target; if (t.type === "number" && document.activeElement === t) t.blur(); }, { passive: true });
  $("conteudo").addEventListener("toggle", function(ev){ if (ev.target.classList && ev.target.classList.contains("hist")) S.abertoHist = ev.target.open; }, true);
  $("conteudo").addEventListener("click", function(ev){
    var b = ev.target.closest && ev.target.closest("[data-act]"); if (!b || b.disabled) return;
    var a = b.dataset.act;
    if ((a === "add" || a === "rm" || a === "sem" || a === "desfazer") && S.confirmaEnvio) S.confirmaEnvio = false;
    if ((a === "add" || a === "sem" || a === "voltar") && S.desfazer){ S.desfazer = null; }
    if (a === "add"){ if (S.linhas.length < 30){ S.linhas.push(novaLinha()); S.sujo = true; desenhar(); var ss = document.querySelectorAll('select[data-f="material"]'); if (ss.length) ss[ss.length - 1].focus(); } }
    else if (a === "rm"){ if (S.linhas.length > 1){ var ix = +b.dataset.i; S.desfazer = { l: S.linhas[ix], i: ix }; S.linhas.splice(ix, 1); S.sujo = true; desenhar(); } }
    else if (a === "desfazer"){ if (S.desfazer){ S.linhas.splice(Math.min(S.desfazer.i, S.linhas.length), 0, S.desfazer.l); S.desfazer = null; S.sujo = true; desenhar(); } }
    else if (a === "sem"){ S.sem = !S.sem; S.sujo = true; desenhar(); }
    else if (a === "enviar") enviar(false);
    else if (a === "enviar-ok") enviar(true);
    else if (a === "enviar-voltar"){ S.confirmaEnvio = false; desenhar(); }
    else if (a === "pedir") pedirAutorizacao();
    else if (a === "filtro"){ S.filtro = S.filtro === b.dataset.k ? "todas" : b.dataset.k; desenhar(); }
    else if (a === "abrir") abrirUsina(b.dataset.u);
    else if (a === "abrir-sel"){ if (S.selUsina) abrirUsina(S.selUsina); }
    else if (a === "voltar"){ if (temNaoEnviado() && !window.confirm("O pedido desta usina ainda NÃO foi enviado. Se voltar agora, ele se perde.\n\nVoltar mesmo assim?")) return; S.usinaSel = null; S.msg = ""; S.sujo = false; S.mp = null; S.mpForm = null; recarregar(true); }
    else if (a === "aprovar") decidir(b.dataset.id, true);
    else if (a === "aprovar-abrir") decidir(b.dataset.id, true, b.dataset.u);
    else if (a === "negar"){ if (S.confirmaNegar !== b.dataset.id){ S.confirmaNegar = b.dataset.id; desenhar(); } else decidir(b.dataset.id, false); }
    else if (a === "mp-abrir"){
      var l = mpLinha(b.dataset.l); if (!l) return;
      S.mpForm = { linha: l.id, tipo: b.dataset.t, material: "", carretas: String(l.carretas), periodo: l.periodo || "", motivo: "", erro: "" };
      desenhar(); var mt = $("mpMot"); if (mt && b.dataset.t === "cancelar") mt.focus();
    }
    else if (a === "mp-fechar"){ S.mpForm = null; desenhar(); }
    else if (a === "mp-enviar") mpEnviar();
  });

  /* ---------- Início ---------- */
  (async function iniciar(){
    var c = lembrada(); if (!c) { $("chave").focus(); return; }
    carregando(true);
    try { await entrar(c); } catch (e) { guardar(""); }
    carregando(false);
  })();
  (function(){   // aviso de versão nova (navegador com a página antiga guardada)
    var meta = document.querySelector('meta[name="app-versao"]'), minha = meta ? meta.content : ""; if (!minha || !window.fetch) return;
    var avisado = false;
    function conferir(){
      if (avisado || document.visibilityState !== "visible") return;
      fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.ok ? r.text() : ""; }).then(function(t){
        var m = /<meta name="app-versao" content="([^"]+)"/.exec(t || ""); if (!m || m[1] === minha) return;
        avisado = true;
        var b = document.createElement("div"); b.setAttribute("role", "alert");
        b.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#151a23;color:#fff;border:1px solid #e11d48;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)";
        b.innerHTML = '🔄 Há uma versão nova desta página. <button type="button" style="font:inherit;font-weight:700;padding:6px 12px;border-radius:7px;border:0;background:#e11d48;color:#fff;cursor:pointer">Atualizar</button>';
        b.querySelector("button").addEventListener("click", function(){ location.reload(); });
        document.body.appendChild(b);
      }).catch(function(){});
    }
    setTimeout(conferir, 20000); setInterval(conferir, 300000);
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") conferir(); });
  })();
  window.__sol = { estado: function(){ return S; } };
})();
</script>
